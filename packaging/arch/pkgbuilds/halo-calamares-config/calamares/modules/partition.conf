# GPT + a 1 GiB EFI partition (room for kernels and Windows' loader when dual booting) + Btrfs.
# Calamares itself refuses to shrink BitLocker-encrypted partitions; suspend BitLocker in Windows first.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1024MiB
    minimumSize: 300MiB
    label: "EFI"

defaultPartitionTableType: gpt
requiredPartitionTableType: [ gpt, msdos ]

userSwapChoices:
    - none
    - file
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]

enableLuksAutomatedPartitioning: true
