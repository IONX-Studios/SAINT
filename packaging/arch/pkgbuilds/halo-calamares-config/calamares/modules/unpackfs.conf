# The live root (archiso mounts the ISO at /run/archiso/bootmnt; install_dir is "halo") and the
# kernel, which mkarchiso moves out of the image onto the ISO.
---
unpack:
    - source: "/run/archiso/bootmnt/halo/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
    - source: "/run/archiso/bootmnt/halo/boot/x86_64/vmlinuz-linux"
      sourcefs: "file"
      destination: "/boot/vmlinuz-linux"
