---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - input
    - network
    - storage
    - lp
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
    nonempty: true
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, liveuser ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "halo-${cpu}"
    forbidden_names: [ localhost ]
