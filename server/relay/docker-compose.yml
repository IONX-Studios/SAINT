# Halo Relay + TURN + HTTPS on one small VPS. See README.md.
#   1. point a DNS name at the VPS (A/AAAA record), e.g. relay.example.com
#   2. cp relay.env.example .env and fill it in (HALO_DOMAIN, HALO_TURN_SECRET, HALO_PUBLIC_IP)
#   3. docker compose up -d       (run in this folder)
services:
  relay:
    build:
      context: ../..
      dockerfile: server/relay/Dockerfile
    restart: unless-stopped
    environment:
      HALO_STUN_URLS: "stun:${HALO_DOMAIN}:3478"
      HALO_TURN_URLS: "turn:${HALO_DOMAIN}:3478?transport=udp,turn:${HALO_DOMAIN}:3478?transport=tcp,turns:${HALO_DOMAIN}:5349?transport=tcp"
      HALO_TURN_SECRET: "${HALO_TURN_SECRET}"
    expose: ["8080"]

  # HTTPS (Let's Encrypt, automatic) in front of the relay: browsers only allow WebCrypto on https pages.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      HALO_DOMAIN: "${HALO_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [relay]

  # TURN: only carries media when the phone and the PC can't reach each other directly. Encrypted end to end
  # (DTLS-SRTP), so coturn can't see the screen either.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${HALO_TURN_SECRET}
      - --realm=${HALO_DOMAIN}
      - --external-ip=${HALO_PUBLIC_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --cert=/certs/${HALO_DOMAIN}.crt
      - --pkey=/certs/${HALO_DOMAIN}.key
    volumes:
      # optional: a certificate for HALO_DOMAIN as turn-certs/<domain>.crt/.key enables turns: on 5349 (see README)
      - ./turn-certs:/certs:ro

volumes:
  caddy_data:
